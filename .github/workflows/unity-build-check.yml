name: Unity Build Check

# Refactor planının Faz 7'si — hafif CI. Amaç sadece "proje hatasız
# derleniyor mu" doğrulamak, tam bir test paketi değil (proje şu an
# hiç otomatik test içermiyor, bkz. docs/TECH_OVERVIEW.md §22).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  buildCheck:
    name: Build (${{ matrix.targetPlatform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
    steps:
      - name: Checkout (LFS dahil)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Library önbelleği
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Unity ile derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2022.3.62f3

      - name: Build çıktısını yükle (opsiyonel, hata ayıklama için)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-${{ matrix.targetPlatform }}-logs
          path: build/${{ matrix.targetPlatform }}
          retention-days: 3
